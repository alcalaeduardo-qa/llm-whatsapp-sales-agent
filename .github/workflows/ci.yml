# Lint, tests y evals deterministas en cada PR y en cada push a main.
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY  clave de Anthropic para los evals (cuestan ~0.11 USD por corrida)
#   SOFIA_PROMPT       contenido de prompts/sofia.md; el prompt real nunca se sube al repo
# Sin ANTHROPIC_API_KEY los evals se omiten con un aviso; los tests no necesitan secretos.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dependencias
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Tests y cobertura (mínimo 80 %)
        env:
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
        run: pytest

  docker:
    name: Imagen de Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir
        run: docker build -t sofia:ci .
      - name: El prompt real no está en la imagen
        run: |
          if docker run --rm --entrypoint sh sofia:ci -c "test -e /app/prompts/sofia.md -o -e /app/.env"; then
            echo "::error::La imagen contiene prompts/sofia.md o .env"; exit 1
          fi
      - name: Arranca y responde /health
        run: |
          docker run -d --name sofia -p 8000:8000 sofia:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs sofia
          exit 1

  evals:
    name: Evals deterministas
    needs: tests
    # La clave y el prompt real solo llegan a código del dueño del repo: los PR de otras personas no corren evals.
    if: github.event_name == 'push' || github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SOFIA_PROMPT: ${{ secrets.SOFIA_PROMPT }}
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      - uses: actions/checkout@v4
      # Sin la clave no se instala nada, y guardar la caché de pip vacía hace fallar el trabajo
      - uses: actions/setup-python@v5
        if: env.ANTHROPIC_API_KEY != ''
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dependencias
        if: env.ANTHROPIC_API_KEY != ''
        run: pip install -r requirements-dev.txt
      - name: Prompt real desde el secreto
        if: env.SOFIA_PROMPT != ''
        run: |
          printf '%s\n' "$SOFIA_PROMPT" > prompts/sofia.md
          # Solo la huella, nunca el texto: compárala con la del log de Railway al arrancar
          python -c "from app.prompt import huella; print('Huella del prompt', huella())"
      - name: Evals con el prompt real (bloquea el PR si pasa menos del 85 %)
        if: env.ANTHROPIC_API_KEY != '' && env.SOFIA_PROMPT != ''
        run: python -m evals.run --sin-juez --minimo 85
      - name: Evals con la plantilla pública (solo informativo)
        if: env.ANTHROPIC_API_KEY != '' && env.SOFIA_PROMPT == ''
        run: |
          echo "::warning::Sin el secreto SOFIA_PROMPT los evals usan prompts/sofia.example.md y no bloquean el PR"
          python -m evals.run --sin-juez
      - name: Sin clave de Anthropic
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::warning::Falta el secreto ANTHROPIC_API_KEY; se omiten los evals"
