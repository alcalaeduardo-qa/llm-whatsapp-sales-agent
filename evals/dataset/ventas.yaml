# Conversaciones de venta por fase y país. Los mensajes son de la persona; las respuestas las genera
# Sofía en vivo con el flujo real (crisis → Claude → validador). `espera` son checks deterministas
# (ver evals/metricas.py) y `fase_esperada` la usa el juez LLM.

- id: filtro-mx-1
  categoria: filtro
  pais: MX
  fase_esperada: Fase 1. Se presenta como Sofía, asistente de Eduardo, aclara que son sesiones privadas de pago y pregunta de qué país escribe, sin pedir la historia todavía.
  turnos: ["Hola, vi su página"]
  espera: [presentacion, pregunta_pais, no_datos_pago, no_deriva]

- id: filtro-mx-2
  categoria: filtro
  pais: MX
  fase_esperada: Fase 1. Se presenta como Sofía, aclara que son sesiones de pago y pregunta el país antes de que cuente su historia.
  turnos: ["Buenas tardes, quiero información de las terapias"]
  espera: [presentacion, pregunta_pais, no_datos_pago, no_deriva]

- id: filtro-mx-3
  categoria: filtro
  pais: MX
  fase_esperada: Fase 1. Aunque la persona empiece contando su problema, Sofía se presenta, aclara que son sesiones de pago y pregunta el país.
  turnos: ["Hola, mi novio me dejó y no puedo dejar de pensar en él, necesito ayuda"]
  espera: [presentacion, pregunta_pais, no_datos_pago, no_deriva]

- id: filtro-ve-1
  categoria: filtro
  pais: VE
  fase_esperada: Fase 1. Ya dio su país (Venezuela), así que Sofía pregunta si puede pagar con tarjeta de débito o crédito.
  turnos: ["Hola", "Te escribo desde Venezuela"]
  espera: [presentacion, pide_tarjeta, no_datos_pago, no_deriva]

- id: filtro-co-1
  categoria: filtro
  pais: CO
  fase_esperada: Fase 1. Es de Colombia, Sofía pregunta si puede pagar con tarjeta de débito o crédito.
  turnos: ["Buenas", "Soy de Colombia, de Medellín"]
  espera: [presentacion, pide_tarjeta, no_datos_pago, no_deriva]

- id: filtro-ve-2
  categoria: filtro
  pais: VE
  fase_esperada: Fase 1. Es de Venezuela y no puede pagar con tarjeta, así que Sofía cierra con amabilidad y sin vender.
  turnos: ["Hola", "De Venezuela", "No tengo tarjeta, aquí todo es en efectivo o pago móvil"]
  espera: [no_datos_pago, no_deriva]

- id: filtro-otro-1
  categoria: filtro
  pais: ES
  fase_esperada: Fase 1 a 2. Es de España; Sofía avanza invitando a contar su situación, sin pedir tarjeta (eso solo aplica a Venezuela y Colombia).
  turnos: ["Hola Sofía", "Desde España"]
  espera: [presentacion, no_datos_pago, no_deriva]

- id: filtro-otro-2
  categoria: filtro
  pais: US
  fase_esperada: Fase 1. Escribe en español desde Estados Unidos; Sofía se presenta, aclara que son sesiones de pago y pregunta el país o avanza si ya lo dijo.
  turnos: ["Hi, hablo español, estoy en Texas"]
  espera: [presentacion, no_datos_pago, no_deriva]

- id: patron-mx-1
  categoria: patron
  pais: MX
  fase_esperada: Fase 2. Detecta el tema (pareja) y hace una o dos preguntas espejo con sus palabras para que vea que es un patrón que se repite. Todavía no da precio ni datos de pago.
  turnos: ["Hola", "De México", "Siempre termino con hombres que no me valoran, ya van tres relaciones así"]
  espera: [no_datos_pago, no_deriva]

- id: patron-mx-2
  categoria: patron
  pais: MX
  fase_esperada: Fase 2. Tema ansiedad; Sofía valida brevemente y confronta con una pregunta espejo sobre cuántas veces le ha pasado.
  turnos: ["Hola buenas", "Soy de Guadalajara", "Tengo mucha ansiedad, me despierto en la madrugada con el corazón acelerado"]
